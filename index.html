<title>Neon Harbor</title>

<meta name="description" content="雨に濡れた湾岸都市を歩いて・飛んで探索できるリアルタイム3Dシティ（Three.js / WebGL2）">

<style>
  :root {
    color-scheme: dark;
    --ground: #05070c;
    --panel: rgba(7, 10, 18, 0.78);
    --panel-edge: rgba(255, 255, 255, 0.16);
    --ink: #eef2fa;
    --ink-soft: #b4bdd0;
    --sodium: #ffb454;
    --sodium-ink: #1a1206;
    --display: "Syncopate", "Arial Black", system-ui, sans-serif;
    --body: "IBM Plex Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ground); color: var(--ink); font-family: var(--body); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

  .panel { background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 6px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }

  /* intro card */
  #intro { position: fixed; left: max(16px, 4vw); bottom: max(16px, 6vh); max-width: min(520px, calc(100vw - 32px)); box-sizing: border-box; padding: 22px 22px 20px; display: grid; gap: 14px; z-index: 5; }
  #intro h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(26px, 5vw, 44px); letter-spacing: 0.06em; line-height: 1.05; text-wrap: balance; }
  #intro h1 span { color: var(--sodium); }
  #intro p { margin: 0; color: var(--ink-soft); font-size: 14px; line-height: 1.7; max-width: 44ch; }
  #intro .coords { font-family: var(--mono); font-size: 12px; color: var(--ink-soft); letter-spacing: 0.04em; }
  .starts { display: flex; flex-wrap: wrap; gap: 10px; }
  .btn { font: 600 15px/1 var(--body); padding: 13px 18px; border-radius: 4px; cursor: pointer; letter-spacing: 0.04em; border: 1px solid var(--sodium); }
  .btn.primary { background: var(--sodium); color: var(--sodium-ink); }
  .btn.ghost { background: transparent; color: var(--sodium); }
  .btn:focus-visible, .seg button:focus-visible, .chip:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .btn[disabled] { opacity: 0.6; cursor: progress; }
  #err { color: #ffd2c2; font-size: 13px; line-height: 1.6; }

  /* HUD */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 4; }
  #hud > * { pointer-events: auto; }
  #stats { position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); left: 16px; padding: 10px 12px; font-family: var(--mono); font-size: 12px; line-height: 1.6; color: var(--ink); font-variant-numeric: tabular-nums; }
  #stats b { font-family: var(--display); font-size: 11px; letter-spacing: 0.14em; color: var(--sodium); font-weight: 700; display: block; margin-bottom: 2px; }
  #stats .k { color: var(--ink-soft); }
  #controls { position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; max-width: calc(100vw - 32px); }
  .seg { display: flex; padding: 3px; gap: 2px; }
  .seg button, .chip { font: 500 12px/1 var(--body); color: var(--ink); background: transparent; border: 0; padding: 9px 11px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: var(--sodium); color: var(--sodium-ink); font-weight: 600; }
  .chip { background: var(--panel); border: 1px solid var(--panel-edge); }
  .chip[aria-pressed="true"] { border-color: var(--sodium); color: var(--sodium); }
  #keys { position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); padding: 10px 12px; font-size: 12px; line-height: 1.9; color: var(--ink-soft); }
  #keys kbd { font-family: var(--mono); font-size: 11px; color: var(--ink); border: 1px solid var(--panel-edge); border-bottom-width: 2px; border-radius: 3px; padding: 1px 5px; margin-right: 2px; background: rgba(255,255,255,0.05); }
  #resume { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 10px 16px; font-size: 13px; color: var(--ink); }
  #reticle { position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; background: rgba(255,255,255,0.7); box-shadow: 0 0 6px rgba(255,180,84,0.8); pointer-events: none; }

  /* touch */
  #touch { display: none; pointer-events: none; }
  body.is-touch #touch { display: block; }
  body.is-touch #keys, body.is-touch #reticle { display: none; }
  #pad { position: fixed; left: 28px; bottom: calc(40px + env(safe-area-inset-bottom, 0px)); width: 124px; height: 124px; margin: 0; border-radius: 50%; border: 1px solid rgba(255,255,255,0.28); background: rgba(7,10,18,0.35); pointer-events: none; transition: opacity .2s; opacity: 0.55; }
  #pad.active { opacity: 1; }
  #pad i { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; background: rgba(255,180,84,0.9); }
  #hint { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); font-size: 12px; color: var(--ink-soft); background: var(--panel); padding: 6px 10px; border-radius: 4px; white-space: nowrap; transition: opacity 1s; }
  .tbtns { position: fixed; right: 20px; bottom: calc(36px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; pointer-events: auto; }
  .tbtns button { width: 64px; height: 64px; border-radius: 50%; font: 600 14px/1 var(--body); color: var(--ink); background: var(--panel); border: 1px solid var(--panel-edge); -webkit-tap-highlight-color: transparent; }
  .tbtns button:active { background: var(--sodium); color: var(--sodium-ink); }
  body.mode-walk #flyBtns, body.mode-fly #walkBtns { display: none; }

  #toast { position: fixed; left: 50%; top: calc(76px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); padding: 8px 14px; font-size: 14px; color: var(--ink); white-space: nowrap; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; }
  #toast b { color: var(--sodium); font-weight: 600; }
  body.hud-off #hud { display: none; }
  @media (max-width: 640px) {
    #stats { display: none; }
    #controls { left: 12px; right: 12px; justify-content: space-between; max-width: none; gap: 6px; }
    .seg button, .chip { padding: 9px 8px; font-size: 12px; }
  }
</style>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

// ================================================================ utilities
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = mulberry32(20260923);
const R = (a, b) => a + (b - a) * rand();
const pick = (arr) => arr[Math.floor(rand() * arr.length)];
const isTouch = matchMedia('(pointer: coarse)').matches || (navigator.maxTouchPoints > 0 && !matchMedia('(pointer: fine)').matches);
if (isTouch) document.body.classList.add('is-touch');
const DETAIL = 1; // layer for small street props: visible to the camera, skipped by the mirror pass

const GLSL_NOISE = /* glsl */`
float h21(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float h31(vec3 p){ p = fract(p * 0.1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(h21(i), h21(i + vec2(1.0, 0.0)), u.x), mix(h21(i + vec2(0.0, 1.0)), h21(i + vec2(1.0, 1.0)), u.x), u.y); }
float fbm(vec2 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 4; i++){ s += a * vnoise(p); p *= 2.03; a *= 0.5; } return s; }
float bandAA(float x, float a, float b, float w){ return smoothstep(a - w, a + w, x) - smoothstep(b - w, b + w, x); }
`;

// ================================================================ renderer
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
let quality = 'high';
const pixelRatio = () => quality === 'high' ? Math.min(devicePixelRatio, isTouch ? 1.35 : 1.5) : Math.min(devicePixelRatio, 1);
renderer.setPixelRatio(pixelRatio());
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x2b3552, 0.0011);
const fovFor = (a) => a < 1 ? 80 : 66; // wider vertical FOV in portrait so the view is not a slit
const camera = new THREE.PerspectiveCamera(fovFor(innerWidth / innerHeight), innerWidth / innerHeight, 0.5, 5000);
camera.layers.enable(DETAIL);

const U = {
  time: { value: 0 }, win: { value: 1 }, wet: { value: 1 }, rain: { value: 0 }, kitR: { value: isTouch ? 85 : 140 },
  lamps: { value: 1 }, fogD: { value: 0.0011 }, waterZ: { value: 0 },
};

// ================================================================ city layout constants
const N = 16, BLOCK = 50, ROAD = 16, P = BLOCK + ROAD, HALF = N * P / 2;
const roadLine = (k) => -HALF + k * P;
const WATER_ROW = N - 3;
const RZW = roadLine(WATER_ROW);
const Z_WATER = RZW + ROAD / 2 + 12;
U.waterZ.value = Z_WATER;
const DOWNTOWN = new THREE.Vector2(roadLine(N / 2) + P * 0.5, roadLine(WATER_ROW - 3));
const nearRoad = (v, m) => { const r = ((v + HALF) % P + P) % P; return Math.min(r, P - r) < ROAD / 2 + m; };

// ================================================================ PBR patcher
function patch(mat, o) {
  mat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, o.uniforms || {});
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWP;\n' + (o.vHead || ''))
      .replace('#include <worldpos_vertex>', `#include <worldpos_vertex>
        { vec4 _w = vec4(transformed, 1.0);
          #ifdef USE_INSTANCING
            _w = instanceMatrix * _w;
          #endif
          vWP = (modelMatrix * _w).xyz; }
        ` + (o.vMain || ''));
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWP;\n' + GLSL_NOISE + (o.fHead || ''))
      .replace('#include <color_fragment>', '#include <color_fragment>\n' + (o.fColor || ''))
      .replace('#include <roughnessmap_fragment>', '#include <roughnessmap_fragment>\n' + (o.fRough || ''))
      .replace('#include <metalnessmap_fragment>', '#include <metalnessmap_fragment>\n' + (o.fMetal || ''))
      .replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\n' + (o.fEmis || ''));
  };
  mat.customProgramCacheKey = () => o.key;
  return mat;
}

// ================================================================ textures
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return t;
}
const asphaltTex = canvasTex(512, 512, (g, w, h) => {
  const img = g.createImageData(w, h);
  for (let i = 0; i < w * h; i++) {
    const v = 38 + Math.random() * 26 + (Math.random() < 0.02 ? 40 : 0);
    img.data[i * 4] = v; img.data[i * 4 + 1] = v; img.data[i * 4 + 2] = v * 1.04; img.data[i * 4 + 3] = 255;
  }
  g.putImageData(img, 0, 0);
});
asphaltTex.wrapS = asphaltTex.wrapT = THREE.RepeatWrapping;
const poolTex = canvasTex(128, 128, (g, w, h) => {
  const gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.35, 'rgba(160,160,160,1)');
  gr.addColorStop(0.7, 'rgba(40,40,40,1)'); gr.addColorStop(1, 'rgba(0,0,0,1)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});
const SIGN_WORDS = ['ラーメン', 'ホテル', 'カラオケ', 'BAR', '居酒屋', '薬局', '喫茶', '寿司', '24H', 'GAME', '焼肉', 'スナック', '歯科', '質屋', '麻雀', 'うどん'];
const NEON = ['#ff2a8a', '#19e0ff', '#ffb020', '#3dff9a', '#b07bff', '#ff4040', '#ffffff', '#ff7a1a'];
const signTextures = SIGN_WORDS.map((word, i) => canvasTex(128, 512, (g, w, h) => {
  const col = NEON[i % NEON.length];
  const lightBox = i % 3 === 1; // some signs are backlit panels instead of neon tubes
  g.fillStyle = lightBox ? col : '#07070b'; g.fillRect(0, 0, w, h);
  g.strokeStyle = lightBox ? '#ffffff' : col; g.lineWidth = 6; g.shadowColor = col; g.shadowBlur = lightBox ? 0 : 18;
  g.strokeRect(10, 10, w - 20, h - 20);
  const chars = [...word];
  const step = Math.min(110, (h - 60) / chars.length);
  g.font = `700 ${Math.floor(step * 0.82)}px "Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif`;
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = lightBox ? '#101010' : '#fff8f0';
  const y0 = h / 2 - step * (chars.length - 1) / 2;
  chars.forEach((ch, k) => { g.shadowBlur = lightBox ? 0 : 24; g.fillText(ch, w / 2, y0 + k * step); });
}));
const vendTex = canvasTex(128, 256, (g, w, h) => {
  g.fillStyle = '#e8eef5'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#0d1a2a'; g.fillRect(8, 10, w - 16, 128);
  const cols = ['#e33', '#fc3', '#2a6', '#39f', '#f80', '#fff', '#c2c', '#6cf'];
  for (let r = 0; r < 4; r++) for (let c = 0; c < 6; c++) {
    g.fillStyle = cols[(r * 7 + c * 3) % cols.length];
    g.fillRect(14 + c * 18, 18 + r * 30, 12, 20);
    g.fillStyle = '#3f3'; g.fillRect(16 + c * 18, 40 + r * 30, 6, 3);
  }
  g.fillStyle = '#20242a'; g.fillRect(20, 190, w - 40, 40);
  g.fillStyle = '#9aa'; g.fillRect(90, 150, 22, 30);
});

// ================================================================ sky & environment
const skyUniforms = {
  uTop: { value: new THREE.Color() }, uHor: { value: new THREE.Color() }, uWarm: { value: new THREE.Color() },
  uGround: { value: new THREE.Color() }, uSunDir: { value: new THREE.Vector3(0, 1, 0) }, uSunCol: { value: new THREE.Color() },
  uGlow: { value: 1 }, uDisk: { value: 0 }, uStars: { value: 0 }, uClouds: { value: 0.5 }, uTime: U.time,
};
const skyMat = new THREE.ShaderMaterial({
  uniforms: skyUniforms, side: THREE.BackSide, depthWrite: false,
  vertexShader: /* glsl */`
    varying vec3 vDir;
    void main(){ vDir = position; vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.0); gl_Position = p.xyww; }`,
  fragmentShader: /* glsl */`
    uniform vec3 uTop, uHor, uWarm, uGround, uSunDir, uSunCol;
    uniform float uGlow, uDisk, uStars, uClouds, uTime;
    varying vec3 vDir;
    ${GLSL_NOISE}
    void main(){
      vec3 d = normalize(vDir);
      float h = d.y;
      float sd = dot(d, uSunDir);
      vec3 hor = mix(uHor, uWarm, pow(clamp(sd * 0.5 + 0.5, 0.0, 1.0), 9.0));
      vec3 col = mix(hor, uTop, pow(clamp(h, 0.0, 1.0), 0.45));
      col = mix(col, uGround, smoothstep(0.0, -0.08, h));
      float s = max(sd, 0.0);
      col += uSunCol * uGlow * (0.25 * pow(s, 6.0) + 0.6 * pow(s, 90.0));
      col += uSunCol * uDisk * smoothstep(0.99935, 0.9996, sd) * 18.0;
      vec3 sp = d * 260.0; vec3 ci = floor(sp);
      float st = h31(ci);
      float tw = 0.6 + 0.4 * sin(uTime * 3.0 + st * 60.0);
      float core = max(1.0 - length(fract(sp) - 0.5) * 2.2, 0.0);
      col += vec3(0.9, 0.95, 1.0) * step(0.9972, st) * smoothstep(0.03, 0.3, h) * uStars * tw * core * 3.0;
      if (h > 0.0) {
        vec2 cp = d.xz / (h + 0.08) * 1.2 + vec2(uTime * 0.004, 0.0);
        float c = smoothstep(0.52, 0.85, fbm(cp)) * uClouds * smoothstep(0.0, 0.12, h);
        vec3 cc = mix(uHor * 0.7, uSunCol * 1.3, pow(s, 3.0));
        col = mix(col, cc, c * 0.65);
      }
      gl_FragColor = vec4(col, 1.0);
    }`,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(1000, 48, 24), skyMat);
sky.renderOrder = -10; sky.frustumCulled = false;
scene.add(sky);

const envScene = new THREE.Scene();
envScene.add(new THREE.Mesh(new THREE.SphereGeometry(50, 32, 16), skyMat));
const envLightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

  const fx = nx > 0 ? b.x1 : nx < 0 ? b.x0 : b.cx, fz = nz > 0 ? b.z1 : nz < 0 ? b.z0 : b.cz;
  const rot = nx !== 0 ? Math.PI / 2 : 0;
  const B = gb('building', b.cx, b.cz);
  for (let y = y0; y < y1 - 2.5; y += 3.0) {
    B.box(fx + nx * 0.65, y, fz + nz * 0.65, along, 0.2, 1.3, [seed, 8, 0, 999], [0.72, 0.71, 0.68], rot);
    B.box(fx + nx * 1.28, y + 0.2, fz + nz * 1.28, along, 1.0, 0.06, [seed, 9, 0, 999], rail, rot);

}

function tower(cx, cz, lw, ld, H, facing, downtown) {
  const seed = rand();
  const glassy = downtown ? rand() < 0.72 : rand() < 0.35;
  const shaftStyle = glassy ? 0 : (rand() < 0.65 ? 1 : 2);
  const lit = shaftStyle === 0 ? R(0.15, 0.45) : R(0.25, 0.6);
  const tint = TINT[shaftStyle]();
  let base = 0;
  const lot = move(SHAPES.rect(lw, ld), cx, cz);
  if (H > 45 && rand() < 0.75) { // podium
    base = Math.round(R(2, 4)) * 4.5;
    const ps = rand() < 0.6 ? 5 : 1;
    mass(lot, 0, base, ps, seed + 0.11, R(0.3, 0.7), TINT[ps]());
    coping(lot, base, seed);
    streetFront(bbox(lot), facing, 5, base, downtown);
  }
  // shaft plan
  const sw = base ? lw * R(0.6, 0.82) : lw, sd = base ? ld * R(0.6, 0.82) : ld;
  const ox = base ? R(-0.5, 0.5) * (lw - sw) : 0, oz = base ? R(-0.5, 0.5) * (ld - sd) : 0;
  const r = rand();
  let shape;
  if (shaftStyle === 2) shape = SHAPES.rect(sw, sd);
  else if (r < 0.28) shape = SHAPES.rect(sw, sd);
  else if (r < 0.48) shape = SHAPES.chamfer(sw, sd, Math.min(sw, sd) * R(0.1, 0.25));
  else if (r < 0.68) shape = SHAPES.rounded(sw, sd, Math.min(sw, sd) * R(0.15, 0.45), 5);
  else if (r < 0.8 && glassy) shape = SHAPES.ellipse(Math.min(sw, sd) * R(1, 1.1), Math.min(sw, sd), 26);
  else if (r < 0.9) shape = SHAPES.L(sw, sd, sw * R(0.3, 0.5), sd * R(0.3, 0.5));
  else shape = SHAPES.chamfer(sw, sd, Math.min(sw, sd) * 0.29);
  let poly = move(shape, cx + ox, cz + oz, rand() < 0.5 ? 0 : Math.PI / 2 * Math.floor(rand() * 4));
  let y = base;
  const tiers = H > 100 ? 1 + Math.floor(rand() * 3) : (H > 50 && rand() < 0.4 ? 2 : 1);
  for (let t = 0; t < tiers; t++) {
    const yEnd = t === tiers - 1 ? H : y + (H - y) * R(0.45, 0.72);
    mass(poly, y, yEnd, shaftStyle, seed, lit, tint);
    const b = bbox(poly);
    if (shaftStyle === 1 && rand() < 0.6) for (let yy = y + 4 * 3.9; yy < yEnd - 3; yy += 4 * 3.9) ledge(poly, yy, 0.25, 0.35, seed, TRIM());
    if (shaftStyle === 2) balconies(b, facing, Math.max(y, 4.8), yEnd, seed, pick([[0.6, 0.66, 0.7], [0.75, 0.74, 0.7], [0.3, 0.32, 0.35]]));
    if (t === 0 && !base) streetFront(b, facing, shaftStyle === 0 ? 0 : shaftStyle === 2 ? 2 : 1, yEnd, downtown);
    coping(poly, yEnd, seed);
    y = yEnd;
    if (t < tiers - 1) {
      const nb = bbox(poly);
      if (Math.min(nb.w, nb.d) < 16) break;
      poly = offsetPoly(poly, -R(2, 4));
    }
  }
  H = y;
  const fb = bbox(poly);
  // crown
  const crown = glassy ? pick(['taper', 'ring', 'flat', 'spire', 'ring']) : pick(['flat', 'flat', 'ring']);
  if (crown === 'taper') {
    const ch = R(8, 22);
    mass(poly, H, H + ch, 0, seed + 0.5, lit * 0.5, tint, { taper: R(0.15, 0.5), noCollide: true });
    if (rand() < 0.6) glowRing(poly, H - 0.3, 0.45, scaleC(pick(NEON_COLS), 2.2));
    H += ch;
  } else if (crown === 'ring') {
    glowRing(poly, H - 0.7, 0.5, scaleC(pick(NEON_COLS), 2.2));
    const inner = offsetPoly(poly, -1.5);
    gb('building', fb.cx, fb.cz).prism(inner, H, H + R(3, 6), [seed, 8, 0, 999], [0.24, 0.25, 0.27]);
    rooftop(inner, H + 4, seed, shaftStyle);
  } else if (crown === 'spire') {
    const sh = R(20, 45);
    gb('building', fb.cx, fb.cz).prism(move(SHAPES.ellipse(2.4, 2.4, 10), fb.cx, fb.cz), H, H + sh, [seed, 10, 0, 999], [0.75, 0.77, 0.8], { taper: 0.25 });
    warnLights.push(new THREE.Vector3(fb.cx, H + sh + 0.5, fb.cz));
    rooftop(poly, H, seed, shaftStyle);
  } else rooftop(poly, H, seed, shaftStyle);
  if (glassy && poly.length <= 8 && rand() < 0.35) {
    const c = scaleC(pick(NEON_COLS), 1.1);
    for (const [px, pz] of poly) glowBox(px, base, pz, 0.35, H - base, 0.35, c);
  }
  if (H > 90) { warnLights.push(new THREE.Vector3(poly[0][0], H + 0.6, poly[0][1])); warnLights.push(new THREE.Vector3(poly[Math.floor(poly.length / 2)][0], H + 0.6, poly[Math.floor(poly.length / 2)][1])); }
}

function lowBuilding(x, z, w, d, facing, hMax) { kitBuilding(x, z, w, d, facing, hMax); }

function lowBlock(cx, cz, hMax) {
  const I = BLOCK - 8, h0 = I / 2;
  const dN = R(10, 15), dS = R(10, 15), dW = R(9, 13), dE = R(9, 13);
  const runs = [
    { a: -h0, b: h0, axis: 'x', z0: cz - h0, d: dN, facing: [0, -1] },
    { a: -h0, b: h0, axis: 'x', z0: cz + h0 - dS, d: dS, facing: [0, 1] },
    { a: -h0 + dN, b: h0 - dS, axis: 'z', x0: cx - h0, d: dW, facing: [-1, 0] },
    { a: -h0 + dN, b: h0 - dS, axis: 'z', x0: cx + h0 - dE, d: dE, facing: [1, 0] },
  ];
  for (const run of runs) {
    let t = run.a;
    while (t < run.b - 3) {
      let wl = Math.min(3 * pick([2, 3, 3, 4, 4, 5]) + 0.4, run.b - t);
      if (run.b - t - wl < 6.4) wl = run.b - t;
      const mid = t + wl / 2;
      const dd = run.d - R(0, 2.5);
      if (run.axis === 'x') lowBuilding(cx + mid, run.z0 + (run.facing[1] < 0 ? dd / 2 : run.d - dd / 2), wl - 0.25, dd, run.facing, hMax);
      else lowBuilding(run.x0 + (run.facing[0] < 0 ? dd / 2 : run.d - dd / 2), cz + mid, dd, wl - 0.25, run.facing, hMax);
      t += wl;
    }
  }
  const iw = I - dW - dE - 4, id = I - dN - dS - 4;
  if (iw > 10 && id > 10 && rand() < 0.6) tower(cx, cz, iw, id, R(20, Math.max(24, hMax)), [0, 1], false);
}

const parkBlocks = new Set([`${N / 2 - 3},${WATER_ROW - 1}`, `${N / 2 - 4},${WATER_ROW - 1}`, `${N / 2 + 3},${WATER_ROW - 6}`]);
for (let j = 0; j < WATER_ROW; j++) for (let i = 0; i < N; i++) {
  const cx = roadLine(i) + P / 2, cz = roadLine(j) + P / 2;
  slabs.push({ x: cx, z: cz, w: BLOCK, d: BLOCK, h: 0.5 });
  if (parkBlocks.has(`${i},${j}`)) {
    parks.push({ x: cx, z: cz, w: BLOCK - 6, d: BLOCK - 6 });
    for (let t = 0; t < 30; t++) trees.push({ x: cx + R(-19, 19), z: cz + R(-19, 19), s: R(0.8, 1.4) });
    continue;
  }
  const dd = Math.hypot(cx - DOWNTOWN.x, cz - DOWNTOWN.y);
  const hMax = 22 + 215 * Math.exp(-Math.pow(dd / 250, 2)) + (j === WATER_ROW - 1 ? 25 : 0);
  if (hMax < 58) { lowBlock(cx, cz, hMax); continue; }
  const downtown = hMax > 120;

const pbrCache = {};
function pbrSet(name, repeat = 1) {
  const key = name + repeat;
  if (pbrCache[key]) return pbrCache[key];
  const ld = (suffix, srgb) => { const t = texLoader.load(`assets/tex/${name}_${suffix}.jpg`); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat, repeat); t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy()); if (srgb) t.colorSpace = THREE.SRGBColorSpace; return t; };
  const arm = ld('arm');
  return (pbrCache[key] = { map: ld('diff', true), normalMap: ld('nor'), aoMap: arm, roughnessMap: arm, metalnessMap: arm });
}
function pbrMaterial(name, repeat = 1, extra = {}) { return new THREE.MeshStandardMaterial({ ...pbrSet(name, repeat), metalness: 1, roughness: 1, ...extra }); }

  } else {
    const e = new THREE.Euler().setFromQuaternion(camera.quaternion, 'YXZ');
    player.pos.copy(camera.position); player.yaw = e.y; player.pitch = e.x;
  }
  setMode(m);
  if (!isTouch && canvas.requestPointerLock) {
    try { const pr = canvas.requestPointerLock(); if (pr && pr.catch) pr.catch(() => { document.getElementById('resume').hidden = false; }); } catch (_) { document.getElementById('resume').hidden = false; }
  }
  canvas.focus();
}
// start on the pavement facing the walk-in shop closest to the waterfront downtown
const spawn = (() => {
  let s = shops[0], bdist = Infinity;
  for (const c of shops) { const d = Math.hypot(c.x - DOWNTOWN.x, c.z - RZW) + (c.type.key === 'cafe' || c.type.key === 'bar' ? 0 : 60); if (d < bdist) { bdist = d; s = c; } }
  if (!s) return { x: DOWNTOWN.x - 27, z: Z_WATER - 3.2, yaw: 0.25 };
  const x = s.door[0] + s.n[0] * 6 + s.t[0] * 2.5, z = s.door[1] + s.n[1] * 6 + s.t[1] * 2.5;
  return { x, z, yaw: Math.atan2(s.door[0] - x, s.door[1] - z) + Math.PI };
})();
const startWalk = document.getElementById('startWalk'), startFly = document.getElementById('startFly');
startWalk.addEventListener('click', () => start('walk'));
startFly.addEventListener('click', () => start('fly'));

function onResize() {
  const pr = pixelRatio();
  renderer.setPixelRatio(pr); renderer.setSize(innerWidth, innerHeight);
  composer.setPixelRatio(pr); composer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.fov = fovFor(camera.aspect); camera.updateProjectionMatrix();
  reflector.getRenderTarget().setSize(Math.floor(innerWidth * pr * reflScale()), Math.floor(innerHeight * pr * reflScale()));
  lens.uniforms.uRes.value.set(innerWidth * pr, innerHeight * pr);
}
addEventListener('resize', onResize);

// ================================================================ frame loop
const clock = new THREE.Clock();
const tmpO = new THREE.Object3D();
const fwd = new THREE.Vector3(), right = new THREE.Vector3(), wish = new THREE.Vector3();
let fpsFrames = 0, fpsTime = 0;
const fpsEl = document.getElementById('fps'), posEl = document.getElementById('pos'), altEl = document.getElementById('alt');
const nearest = new Array(DYN).fill(null).map(() => ({ d: Infinity, i: -1 }));

function updateTraffic(dt, t) {
  const sx = signalState(t, 'x'), sz = signalState(t, 'z');
  for (const ln of lanes) {
    const list = ln.cars;
    list.sort((a, b) => (a.s - b.s) * ln.dir);
    const red = ln.signals && (ln.axis === 'x' ? sx : sz) !== 0;
    const span = ln.max - ln.min;
    for (let i = 0; i < list.length; i++) {
      const c = list[i];
      let target = ln.speed;
      // car following (wrap-around leader for the front car)
      if (list.length > 1) {
        const lead = list[(i + 1) % list.length];
        let gap = (lead.s - c.s) * ln.dir; if (gap <= 0) gap += span;
        target = Math.min(target, Math.max(0, (gap - 7) * 1.1));
      }
      // stop line of the next intersection
      if (red) {
        const front = c.s + ln.dir * 2.3;
        const lim = ln.axis === 'x' ? N : WATER_ROW;
        const m = ln.dir > 0 ? Math.ceil((front + ROAD / 2 + 4.5 + HALF) / P) : Math.floor((front - ROAD / 2 - 4.5 + HALF) / P);
        if (m >= 0 && m <= lim) {
          const stop = roadLine(m) - ln.dir * (ROAD / 2 + 4.5);
          const dist = (stop - front) * ln.dir;
          if (dist > -0.5 && dist < 45) target = Math.min(target, Math.sqrt(Math.max(0, 2 * 3.5 * (dist - 0.8))));
        }
      }
      const dv = target - c.v;
      c.v += THREE.MathUtils.clamp(dv, -9 * dt, 3 * dt);
      c.brake = dv < -0.5 || c.v < 0.3 ? 1 : 0;
      c.s += c.v * ln.dir * dt;
      if (c.s > ln.max) c.s -= span; else if (c.s < ln.min) c.s += span;
    }
  }
  let i = 0;
  for (const c of cars) {
    const ln = c.lane, y = ln.y || 0;
    let yaw;
    if (ln.axis === 'x') { tmpO.position.set(c.s, y, ln.c); yaw = ln.dir > 0 ? 0 : Math.PI; }
    else { tmpO.position.set(ln.c, y, c.s); yaw = ln.dir > 0 ? -Math.PI / 2 : Math.PI / 2; }
    tmpO.rotation.set(0, yaw, 0); tmpO.scale.set(c.sx, c.sy, 1); tmpO.updateMatrix();
    for (const k of ['body', 'glass', 'wheel', 'head', 'tail']) carMeshes[k].setMatrixAt(i, tmpO.matrix);
    carMeshes.tail.setColorAt(i, c.brake ? tmpC.setRGB(7, 0.25, 0.15) : tmpC.setRGB(2, 0.08, 0.05));
    tmpO.scale.set(1, 1, 1); tmpO.translateX(9); tmpO.position.y = y + 0.06; tmpO.scale.set(14, 1, 5.5); tmpO.updateMatrix();
    beamMesh.setMatrixAt(i, tmpO.matrix);
    i++;
  }
  for (const m of Object.values(carMeshes)) m.instanceMatrix.needsUpdate = true;
  carMeshes.tail.instanceColor.needsUpdate = true;
  beamMesh.instanceMatrix.needsUpdate = true;
  for (const ax of ['x', 'z']) {
    const st = ax === 'x' ? sx : sz;
    for (let c = 0; c < 3; c++) sigMats[ax][c].color.copy(st === c ? SIG_ON[c] : SIG_OFF[c]);
  }
}

const shopLights = [0, 1].map(() => { const l = new THREE.PointLight(0xffffff, 0, 14, 1.6); scene.add(l); return l; });
const toastEl = document.getElementById('toast');
let toastText = '';
function updateShops(p) {
  let best = [null, null], bd = [Infinity, Infinity];
  for (const s of shops) {
    const d = (s.x - p.x) ** 2 + (s.z - p.z) ** 2;
    if (d < bd[0]) { bd[1] = bd[0]; best[1] = best[0]; bd[0] = d; best[0] = s; } else if (d < bd[1]) { bd[1] = d; best[1] = s; }
  }
  best.forEach((s, i) => {
    const l = shopLights[i];
    if (!s || bd[i] > 45 * 45) { l.intensity = 0; return; }
    l.position.set(s.x, 3.5, s.z); l.color.set(s.type.light);
    l.intensity = s.type.li * (0.6 + 0.4 * Math.min(1, U.lamps.value + 0.3));
    l.distance = Math.max(s.A, s.Bd) * 2 + 4;
  });
  let msg = '';
  insideShop = false;
  const s = best[0];
  if (s && mode === 'walk') {
    const dx = p.x - s.x, dz = p.z - s.z;
    const a = dx * s.t[0] + dz * s.t[1], b = dx * s.n[0] + dz * s.n[1];
    insideShop = Math.abs(a) < s.A + 0.3 && Math.abs(b) < s.Bd + 0.3;
    if (insideShop) msg = `店内：<b>${s.name}</b>`;
    else if (Math.hypot(p.x - s.door[0], p.z - s.door[1]) < 10) msg = `入れる店：<b>${s.name}</b>　入口へ進むと入店`;
  }
  if (msg !== toastText) { toastText = msg; toastEl.innerHTML = msg; toastEl.hidden = !msg; }
}

function updateDynLights(p) {
  for (const n of nearest) { n.d = Infinity; n.i = -1; }
  for (let i = 0; i < lampHeads.length; i++) {
    const h = lampHeads[i];
    const d = (h.x - p.x) ** 2 + (h.z - p.z) ** 2;
    if (d >= nearest[DYN - 1].d) continue;
    let k = DYN - 1;
    while (k > 0 && nearest[k - 1].d > d) { nearest[k].d = nearest[k - 1].d; nearest[k].i = nearest[k - 1].i; k--; }
    nearest[k].d = d; nearest[k].i = i;
  }
  nearest.forEach((n, k) => {
    const l = dynLights[k];
    if (n.i < 0) { l.intensity = 0; return; }
    l.position.copy(lampHeads[n.i]); l.position.y = 7.6;
    l.intensity = 170 * U.lamps.value;
  });
}

function updatePlayer(dt) {
  const f = (keys.has('KeyW') || keys.has('ArrowUp') ? 1 : 0) - (keys.has('KeyS') || keys.has('ArrowDown') ? 1 : 0) - touchMove.ay;
  const s = (keys.has('KeyD') || keys.has('ArrowRight') ? 1 : 0) - (keys.has('KeyA') || keys.has('ArrowLeft') ? 1 : 0) + touchMove.ax;
  const shift = keys.has('ShiftLeft') || keys.has('ShiftRight');
  if (mode === 'walk') {
    fwd.set(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
    right.set(Math.cos(player.yaw), 0, -Math.sin(player.yaw));
    wish.set(0, 0, 0).addScaledVector(fwd, f).addScaledVector(right, s);
    const mag = Math.min(1, wish.length()); if (mag > 0) wish.normalize();
    const run = shift || Math.hypot(touchMove.ax, touchMove.ay) > 0.92;
    const speed = (run ? 6.2 : 2.6) * mag;
    const k = 1 - Math.exp(-dt * (player.onGround ? 10 : 2));
    player.vel.x += (wish.x * speed - player.vel.x) * k;
    player.vel.z += (wish.z * speed - player.vel.z) * k;
    player.vel.y -= 19 * dt;
    if (jumpReq && player.onGround) { player.vel.y = 5.4; player.onGround = false; }
    jumpReq = false;
    let feet = player.pos.y - EYE;
    player.pos.x += player.vel.x * dt; player.pos.z += player.vel.z * dt;
    feet += player.vel.y * dt;
    player.pos.z = Math.min(player.pos.z, Z_WATER - 0.6);
    player.pos.x = THREE.MathUtils.clamp(player.pos.x, -1400, 1400); player.pos.z = Math.max(player.pos.z, -1400);
    resolveWalls(player.pos, feet, feet + 1.8, 0.35);
    const g = groundAt(player.pos.x, player.pos.z, feet);
    if (feet <= g) { feet = g; player.vel.y = 0; player.onGround = true; } else player.onGround = feet - g < 0.05;
    const hs = Math.hypot(player.vel.x, player.vel.z);
    player.bob += hs * dt * 1.9;
    player.pos.y = feet + EYE;
    camera.position.copy(player.pos);
    camera.position.y += player.onGround ? Math.sin(player.bob * 2) * 0.035 * Math.min(1, hs / 2) : 0;
    camera.rotation.set(player.pitch, player.yaw, Math.sin(player.bob) * 0.004 * Math.min(1, hs / 2), 'YXZ');
  } else {
    fwd.set(-Math.sin(player.yaw) * Math.cos(player.pitch), Math.sin(player.pitch), -Math.cos(player.yaw) * Math.cos(player.pitch));
    right.set(Math.cos(player.yaw), 0, -Math.sin(player.yaw));
    const u = (keys.has('Space') || keys.has('KeyE') || touchUp ? 1 : 0) - (keys.has('KeyC') || keys.has('KeyQ') || keys.has('ControlLeft') || touchDown ? 1 : 0);
    jumpReq = false;
    wish.set(0, 0, 0).addScaledVector(fwd, f).addScaledVector(right, s); wish.y += u;
    if (wish.lengthSq() > 1) wish.normalize();
    const speed = (shift ? 110 : 26) * (1 + Math.min(player.pos.y, 300) / 150);
    player.vel.lerp(wish.multiplyScalar(speed), 1 - Math.exp(-dt * 5));
    player.pos.addScaledVector(player.vel, dt);
    player.pos.x = THREE.MathUtils.clamp(player.pos.x, -1400, 1400);
    player.pos.z = THREE.MathUtils.clamp(player.pos.z, -1400, Z_WATER + 1200);
    player.pos.y = Math.min(player.pos.y, 700);
    resolveWalls(player.pos, player.pos.y - 1, player.pos.y + 0.5, 0.9);
    player.pos.y = Math.max(player.pos.y, groundAt(player.pos.x, player.pos.z, player.pos.y - 1.5) + 1.8);
    camera.position.copy(player.pos);
    camera.rotation.set(player.pitch, player.yaw, 0, 'YXZ');
  }
}

function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  U.time.value += dt;
  const t = U.time.value;
  if (!started) {
    const a = t * 0.045 + 0.35;
    camera.position.set(DOWNTOWN.x + Math.sin(a) * 520, 95 + Math.sin(t * 0.13) * 25, DOWNTOWN.y + Math.cos(a) * 520);
    camera.lookAt(DOWNTOWN.x, 70, DOWNTOWN.y);
  } else updatePlayer(dt);
  sky.position.copy(camera.position);
  const focus = camera.position;
  sun.target.position.set(Math.round(focus.x / 8) * 8, 0, Math.round(focus.z / 8) * 8);
  sun.position.copy(sun.target.position).addScaledVector(sunDir, 700);
  sun.target.updateMatrixWorld();
  updateTraffic(dt, t);
  updateDynLights(focus);
  updateShops(focus);
  if (nfReady) nfUpdate(focus, dt);
  warnMat.color.setRGB(1, 0.08, 0.05).multiplyScalar(Math.sin(t * 2.6) > 0.55 ? 7 : 0.25);
  rainMat.uniforms.uCam.value.copy(camera.position);
  rainMat.uniforms.uAmt.value += ((rainOn ? 1 : 0) - rainMat.uniforms.uAmt.value) * Math.min(1, dt * 2);
  U.rain.value = rainMat.uniforms.uAmt.value;
  const expT = insideShop ? Math.min(baseExposure, 0.85) : baseExposure;
  renderer.toneMappingExposure += (expT - renderer.toneMappingExposure) * Math.min(1, dt * 2.5);
  renderer.shadowMap.needsUpdate = true;
  composer.render(dt);
  fpsFrames++; fpsTime += dt;
  if (fpsTime > 0.5) {
    fpsEl.textContent = Math.round(fpsFrames / fpsTime);
    fpsFrames = 0; fpsTime = 0;
    posEl.textContent = `${camera.position.x.toFixed(0).padStart(5)} , ${camera.position.z.toFixed(0).padStart(5)}`;
    altEl.textContent = `${camera.position.y.toFixed(0)} m`;
  }
  requestAnimationFrame(frame);
}

applyPreset('day');
setMode('walk');
startWalk.textContent = `素材を読み込み中 0/${neededModels.length}`;
assetsReady.then(() => { nfUpdate(camera.position, 0, true); startWalk.disabled = startFly.disabled = false; startWalk.textContent = '歩いて探索'; }).catch((e) => { const el = document.getElementById('err'); el.hidden = false; el.textContent = '素材の読み込みに失敗しました: ' + e.message; });
requestAnimationFrame(frame);
window.__dbg = { player, setMode, applyPreset, shops, kitGroups, NF, U };
window.__city = { groups: kitGroups.length, nshops: shops.length, shops: shops.length, verts: vertTotal, colliders: colliders.length, cars: cars.length, signs: signs.length, vendors: vendors.length, poles: utilPoles.length };
</script>
